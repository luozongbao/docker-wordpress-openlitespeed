services:
  wordpress:
    image: litespeedtech/openlitespeed:latest
    container_name: ${COMPOSE_PROJECT_NAME:-wp_ols}_app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${WEBADMIN_PORT:-7080}:7080"   # WebAdmin Console of OpenLiteSpeed
    environment:
      - TZ=Asia/Bangkok
      - ADMIN_USER=${OLS_ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${OLS_ADMIN_PASSWORD:-P@ssw0rd}
    volumes:
      - ./www:/var/www/vhosts/localhost/html
      - ./logs:/usr/local/lsws/logs
      # # Persist OLS config + admin htpasswd so settings survive container recreate
      - ols_conf:/usr/local/lsws/conf
      - ols_admin_conf:/usr/local/lsws/admin/conf
      # Wrapper script that runs wp-cli as www-data (no --allow-root needed).
      - ./ols/scripts/wp-wrapper.sh:/usr/local/bin/wp-wrapper.sh
    command: >
      sh -c 'HASH=$$(openssl passwd -1 "$${ADMIN_PASSWORD}"); printf "$${ADMIN_USER}:$${HASH}\n" > /usr/local/lsws/admin/conf/htpasswd && chown lsadm:lsadm /usr/local/lsws/admin/conf/htpasswd && chmod 600 /usr/local/lsws/admin/conf/htpasswd && chmod +x /usr/local/bin/wp-wrapper.sh && [ -e /usr/bin/wp.real ] || mv /usr/bin/wp /usr/bin/wp.real && ln -sf /usr/local/bin/wp-wrapper.sh /usr/bin/wp && chown -R www-data:www-data /var/www/vhosts/localhost/html && /entrypoint.sh'
    depends_on:
      - database
    networks:
      - app-network

  # MariaDB — uses the existing production volume so no data is lost.
  database:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME:-wp_ols}_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DATABASENAME}
      - MYSQL_USER=${DATABASEUSER}
      - MYSQL_PASSWORD=${DATABASEPASS}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME:-wp_ols}_network
    driver: bridge

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME:-wp_ols}_db_data
  ols_conf:
    name: ${COMPOSE_PROJECT_NAME:-wp_ols}_conf
  ols_admin_conf:
    name: ${COMPOSE_PROJECT_NAME:-wp_ols}_admin_conf